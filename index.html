<style>
/* Layout: one-column agenda. Sticky header + tabs, then one card per customer to greet. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --sunk:#EEF0F4; --ink:#17202B; --muted:#5B6474; --line:#DFE3EA;

  --wa:#1B8F49; --wa-ink:#FFFFFF;
  --warn:#9A5B00; --warn-soft:#FFF1D6; --ok:#1C7347; --ok-soft:#E1F3E8; --bad:#B3261E; --bad-soft:#FCE4E2;
  --font-display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-cn:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#1A2029; --sunk:#141920; --ink:#E8ECF2; --muted:#9BA4B3; --line:#2B333F;
  --accent:#EE6386; --accent-ink:#1A0B10; --accent-soft:#3A1C26;
  --wa:#3CC873; --wa-ink:#0B1F12;
  --warn:#F3B65B; --warn-soft:#382A12; --ok:#58CC8C; --ok-soft:#16301F; --bad:#FF8A80; --bad-soft:#3A1A18;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --sunk:#141920; --ink:#E8ECF2; --muted:#9BA4B3; --line:#2B333F;
  --accent:#EE6386; --accent-ink:#1A0B10; --accent-soft:#3A1C26;
  --wa:#3CC873; --wa-ink:#0B1F12;
  --warn:#F3B65B; --warn-soft:#382A12; --ok:#58CC8C; --ok-soft:#16301F; --bad:#FF8A80; --bad-soft:#3A1A18;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--font-body);padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,nav.tabs button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wa{background:var(--wa);color:var(--wa-ink);border-color:var(--wa);font-weight:600}

.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.cust-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.cust-head>div{min-width:0}
.meta{color:var(--muted);font-size:13px;margin:2px 0 0}

.pill.due{background:var(--accent-soft);color:var(--accent)}
.pill.today{background:var(--accent);color:var(--accent-ink)}
.pill.missed{background:var(--warn-soft);color:var(--warn)}
.pill.sent{background:var(--ok-soft);color:var(--ok)}
.cust-body{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:14px}
@media (max-width:560px){.cust-body{grid-template-columns:minmax(0,1fr)}.cardimg{max-width:280px}}
.cardimg{width:100%;aspect-ratio:1;border-radius:12px;display:block;background:var(--sunk);max-width:100%}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:500 13px var(--font-body);padding:5px 10px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
textarea,input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea.msg{min-height:190px;resize:vertical;font-family:var(--font-body),var(--font-cn);font-size:14px;line-height:1.55}
.contact{font-size:13.5px;display:grid;gap:3px}
.contact .miss{color:var(--warn)}
.confirm{background:var(--sunk);border-radius:12px;padding:12px;display:grid;gap:10px;font-size:14px}
.confirm dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0}
.confirm dt{color:var(--muted)}
.confirm dd{margin:0;min-width:0;overflow-wrap:anywhere}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .when{width:72px;flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.li .who{flex:1 1 180px;min-width:0}
.li .who small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.issue{font-size:12.5px;border-radius:6px;padding:1px 7px;display:inline-block;margin:2px 4px 0 0}
.issue.block{background:var(--bad-soft);color:var(--bad)}
.issue.soft{background:var(--warn-soft);color:var(--warn)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.form{grid-template-columns:minmax(0,1fr)}}
.form label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
.form .full{grid-column:1/-1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--sunk);font-weight:600;border-top:0}
.empty{text-align:center;padding:28px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--ink);font-family:var(--font-display);font-size:18px;margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.guide ol{padding-left:20px;margin:0;display:grid;gap:8px}
.cn{font-family:var(--font-cn)}
@media (prefers-reduced-motion:no-preference){.cust,.panel{animation:rise .25s ease both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1><span class="dot" aria-hidden="true">✦</span>Customer Birthday Reminder</h1>
      <div style="display:grid;justify-items:end;gap:2px"><div class="today" id="todayLabel"></div><div class="sync" id="syncLabel" data-mode="local"></div></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main" aria-live="polite"></main>
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.json,image/*" hidden>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------------- storage ---------------- */
const KEY="cbr.v1";
const DEFAULT_SETTINGS={senderName:"Ang Siaw Peng",companyEn:"Great Eastern Life",companyCn:"大东方人寿",countryCode:"60",remindDays:7,reminderTime:"08:00",dateFormat:"DMY",defaultLang:"both",testDate:""};
let S=null; // state
function loadState(){
  try{const raw=localStorage.getItem(KEY); if(raw){const s=JSON.parse(raw); s.settings=Object.assign({},DEFAULT_SETTINGS,s.settings||{}); s.sent=s.sent||{}; s.drafts=s.drafts||{}; s.variant=s.variant||{}; s.lang=s.lang||{}; return s;}}catch(e){}
  return exampleState();
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(){saveLocal();if(DB&&dbReady)queueSync();}

/* ---------------- cloud sync (db) ---------------- */
let DB=null,dbReady=false,lastSnap=null,lastState=null,liveClients=false,liveState=false,synced=new Map(),syncedState=null,syncing=false,syncAgain=false,pendingRender=false;
const CFIELDS=["name","company","birthday","phone","email","manager","note","verified","policies"];
function clientDoc(c){const o={};for(const k of CFIELDS)if(c[k]!==undefined&&c[k]!==null)o[k]=c[k];return o;}
function stateDoc(){return {settings:S.settings,sent:S.sent,lang:S.lang,variant:S.variant};}
const SYNC_TEXT={local:"Saved on this device only · 仅保存在本机",loading:"Connecting… · 连接中",saving:"Saving… · 保存中",synced:"✓ Synced on all devices · 已同步",error:"⚠ Not synced · 未同步",offline:"⚠ Can't reach cloud yet · 暂时无法连接"};
let syncMode="local",syncExtra="";
function setSync(m,extra){syncMode=m;syncExtra=extra||"";const el=document.getElementById("syncLabel");if(el){el.textContent=SYNC_TEXT[m]+(syncExtra?" "+syncExtra:"");el.dataset.mode=m;}}
async function queueSync(){
  if(syncing){syncAgain=true;return;}
  syncing=true;setSync("saving");
  try{
    do{
      syncAgain=false;
      const cur=new Map(S.customers.map(c=>[c.id,JSON.stringify(clientDoc(c))]));
      const ops=[];
      for(const [id,j] of cur) if(synced.get(id)!==j) ops.push(["set",id,j]);
      for(const id of [...synced.keys()]) if(!cur.has(id)) ops.push(["del",id]);
      let n=0;
      for(const op of ops){
        const ref=DB.collection("clients").doc(op[1]);
        if(op[0]==="set"){await ref.set(JSON.parse(op[2]));synced.set(op[1],op[2]);}
        else{await ref.delete();synced.delete(op[1]);}
        n++;if(ops.length>20&&n%10===0)setSync("saving",n+"/"+ops.length);
      }
      const st=JSON.stringify(stateDoc());
      if(st!==syncedState){await DB.doc("app/state").set(JSON.parse(st));syncedState=st;}
    }while(syncAgain);
    setSync("synced");
  }catch(e){
    setSync("error");
    toast(e&&e.code==="quota_exceeded"?"Cloud storage is full. Changes are kept on this device.":"Couldn't save to the cloud ("+((e&&e.code)||"error")+"). Changes are kept on this device.",6000);
  }finally{syncing=false;applyRemote();}
}
function snapList(snap){return snap.docs.map(d=>Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data()||{}))));}
function applyRemote(){
  if(syncing||!dbReady)return;
  if(lastSnap){const list=snapList(lastSnap);synced=new Map(list.map(c=>[c.id,JSON.stringify(clientDoc(c))]));S.customers=list;S.isExample=false;cardCache.clear();}
  if(lastState&&lastState.exists){const d=JSON.parse(JSON.stringify(lastState.data()));S.settings=Object.assign({},DEFAULT_SETTINGS,d.settings||{});S.sent=d.sent||{};S.lang=d.lang||{};S.variant=d.variant||{};syncedState=JSON.stringify(stateDoc());}
  saveLocal();safeRender();
}
function firstLive(){
  dbReady=true;
  const remote=snapList(lastSnap);
  synced=new Map(remote.map(c=>[c.id,JSON.stringify(clientDoc(c))]));
  let migrated=false;try{migrated=localStorage.getItem(KEY+".migrated")==="1";}catch(e){}
  const local=(S.isExample||migrated)?[]:S.customers;
  const byKey=new Map(remote.map(c=>[normName(c.name)+"|"+c.birthday,c]));
  const extra=[];
  for(const c of local){const k=normName(c.name)+"|"+c.birthday;const r=byKey.get(k);
    if(r){for(const f of ["phone","email","company"])if(!r[f]&&c[f])r[f]=c[f];if(S.sent)for(const sk in S.sent)if(sk.startsWith(c.id+"|"))S.sent[r.id+sk.slice(c.id.length)]=S.sent[sk];}
    else extra.push(c);}
  const remoteState=lastState&&lastState.exists?JSON.parse(JSON.stringify(lastState.data())):null;
  const localSent=S.sent;
  if(remoteState){S.settings=Object.assign({},DEFAULT_SETTINGS,remoteState.settings||{});S.sent=Object.assign({},localSent,remoteState.sent||{});S.lang=remoteState.lang||{};S.variant=remoteState.variant||{};syncedState=JSON.stringify(remoteState);}
  S.customers=remote.concat(extra);S.isExample=false;cardCache.clear();
  try{localStorage.setItem(KEY+".migrated","1");}catch(e){}
  saveLocal();safeRender();queueSync();
}
function safeRender(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest("main")&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&a.id!=="search"))){pendingRender=true;return;}
  render();
}
document.addEventListener("focusout",()=>{if(pendingRender){pendingRender=false;setTimeout(()=>{if(!pendingRender)safeRender();},250);}});
async function initDb(){
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use("db"):null;}catch(e){db=null;}
  if(!db){setSync("local");return;}
  DB=db;setSync("loading");
  const timer=setTimeout(()=>{if(!dbReady)setSync("offline");},10000);
  const ready=()=>{if(!dbReady&&liveClients&&liveState){clearTimeout(timer);firstLive();}};
  db.collection("clients").onSnapshot(snap=>{lastSnap=snap;if(!snap.metadata.fromCache)liveClients=true;if(dbReady)applyRemote();else ready();},err=>{clearTimeout(timer);setSync("error");});
  db.doc("app/state").onSnapshot(snap=>{lastState=snap;if(!snap.metadata.fromCache)liveState=true;if(dbReady)applyRemote();else ready();},err=>{clearTimeout(timer);setSync("error");});
}

/* ---------------- dates ---------------- */
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS_FULL=["january","february","march","april","may","june","july","august","september","october","november","december"];
const pad=n=>String(n).padStart(2,"0");
const isLeap=y=>(y%4===0&&y%100!==0)||y%400===0;
const dim=(y,m)=>[31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1];
function today(){
  const t=S&&S.settings.testDate;
  if(t&&/^\d{4}-\d{2}-\d{2}$/.test(t)){const [y,m,d]=t.split("-").map(Number);return new Date(y,m-1,d);}
  const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());
}
function ymdStr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fmtDay(d){return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()];}
function fmtLong(d){return fmtDay(d)+" "+d.getFullYear();}
const MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
function longDM(d){return d.getDate()+" "+MONTH_NAMES[d.getMonth()];}
function fmtCn(d){return (d.getMonth()+1)+"月"+d.getDate()+"日";}
/* birthday stored as "YYYY-MM-DD" or "--MM-DD" (year unknown) */
function bParts(b){
  if(!b) return null; let m=/^(\d{4}|-)-(\d{2})-(\d{2})$/.exec(b)||/^--(\d{2})-(\d{2})$/.exec(b);
  if(!m) return null;
  if(m.length===3) return {y:null,m:+m[1],d:+m[2]};
  return {y:m[1]==="-"?null:+m[1],m:+m[2],d:+m[3]};
}
function validMD(y,m,d){return m>=1&&m<=12&&d>=1&&d<=(m===2?29:dim(2001,m))&&!(y&&m===2&&d===29&&!isLeap(y));}
function toBStr(y,m,d){return (y?y:"-")+"-"+pad(m)+"-"+pad(d);}
function parseDateAny(v,fmt){
  if(v===null||v===undefined||v==="") return null;
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600e3);return {y:d.getFullYear(),m:d.getMonth()+1,d:d.getDate()};}
  if(typeof v==="number"&&v>1000&&v<80000){const d=new Date(Math.round((v-25569)*864e5)+12*3600e3);return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate()};}
  const s=String(v).trim(); let m;
  if((m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s))) return chk(+m[1],+m[2],+m[3]);
  if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/.exec(s))){
    let a=+m[1],b=+m[2],y=m[3].length===4?+m[3]:null;
    return fmt==="MDY"?chk(y,a,b):chk(y,b,a);
  }
  if((m=/^(\d{1,2})\s*[- ]\s*([A-Za-z]{3,})\.?\s*[- ,]?\s*(\d{4})?$/.exec(s))){const mi=monIdx(m[2]);if(mi) return chk(m[3]?+m[3]:null,mi,+m[1]);}
  if((m=/^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s*(\d{4})?$/.exec(s))){const mi=monIdx(m[1]);if(mi) return chk(m[3]?+m[3]:null,mi,+m[2]);}
  return null;
  function chk(y,mo,d){ if(y&&(y<1900||y>2100)) return null; return validMD(y,mo,d)?{y,m:mo,d}:null; }
  function monIdx(t){t=t.toLowerCase();const i=MONTHS_FULL.findIndex(x=>x.startsWith(t.slice(0,3)));return i>=0?i+1:0;}
}
function occurrence(b,year){let d=b.d; if(b.m===2&&d===29&&!isLeap(year)) d=28; return new Date(year,b.m-1,d);}

/* returns {date, days} where days in [-7, 358] (recent past kept for "missed") */
function nextInfo(c,t){
  const b=bParts(c.birthday); if(!b) return null;

}
function upcomingDays(c,t){const i=nextInfo(c,t);if(!i)return null;if(i.days<0){const o=occurrence(bParts(c.birthday),i.year+1);return {date:o,days:dayDiff(o,t),year:i.year+1};}return i;}

function wrapLines(ctx,text,maxW){
  const out=[];
  for(const para of String(text).split("\n")){
    if(!para){out.push("");continue;}
    const toks=para.match(/[⺀-鿿＀-￯　-〿]|[^\s⺀-鿿＀-￯　-〿]+|\s+/gu)||[];
    let line="";
    for(const t of toks){const test=line+t;if(ctx.measureText(test).width>maxW&&line.trim()){out.push(line.trimEnd());line=/^\s+$/.test(t)?"":t;}else line=test;}
    out.push(line.trimEnd());
  }
  return out;
}
function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function sendList(t){
  const due=[],missed=[];
  for(const c of S.customers){ if(blocked(c)) continue; const i=nextInfo(c,t); if(!i) continue;

}

const HEAD={
  name:["customername","name","policyholder","clientname","client","customer","fullname","insuredname"],
  company:["company","companyname","employer","organisation","organization","business"],
  birthday:["birthday","dob","dateofbirth","birthdate","bday","dateofbirthddmmyyyy"],

  email:["email","emailaddress","mail","emailid"],
  manager:["accountmanager","manager","agent","agentname","servicingagent","rm","relationshipmanager","advisor","adviser"]

function mapHeaders(row){
  const norm=row.map(h=>String(h||"").toLowerCase().replace(/[^a-z]/g,""));const map={};
  for(const f in HEAD){let i=norm.findIndex(h=>HEAD[f].includes(h));if(i<0)i=norm.findIndex(h=>h&&HEAD[f].some(k=>k.length>3&&h.includes(k)));if(i>=0&&!Object.values(map).includes(i))map[f]=i;}
  return map;
}
function recordsFromRows(rows){
  let hi=-1,map=null;
  for(let i=0;i<Math.min(rows.length,20);i++){const m=mapHeaders(rows[i]);if(m.name!==undefined&&m.birthday!==undefined){hi=i;map=m;break;}}
  if(hi<0) throw new Error("I couldn't find a header row with a name column and a birthday column. Check the first rows have headings like 'Customer Name' and 'Birthday'.");
  const recs=[];
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];if(!r||r.every(v=>v===""||v==null))continue;
    const get=f=>map[f]===undefined?"":r[map[f]];
    recs.push({name:get("name"),company:get("company"),birthdayRaw:get("birthday"),phone:get("phone"),email:get("email"),manager:get("manager"),unclear:[],note:"Row "+(i+1)});}
  return {recs,map};
}
function cleanRecords(recs){

  for(const r of recs){
    const name=titleCase(r.name);
    const p=parseDateAny(r.birthdayRaw,fmt);
    const c={id:uid(),name,company:String(r.company||"").trim(),birthday:p?toBStr(p.y,p.m,p.d):"",phone:String(r.phone||"").trim(),email:String(r.email||"").trim().toLowerCase(),manager:titleCase(r.manager),verified:!(r.unclear&&r.unclear.some(u=>/name|birth/i.test(u))),note:r.note||""};
    if(!p&&r.birthdayRaw!==""&&r.birthdayRaw!=null) c.note=(c.note?c.note+" · ":"")+"Birthday given as '"+String(r.birthdayRaw)+"' could not be read";
    if(r.unclear&&r.unclear.length) c.note=(c.note?c.note+" · ":"")+"Unclear in photo: "+r.unclear.join(", ");
    if(!name&&!c.birthday) continue;
    const key=normName(name)+"|"+c.birthday;
    if(name&&c.birthday&&byKey.has(key)){const e=byKey.get(key);merged++;["phone","email","company","manager"].forEach(f=>{if(!e[f]&&c[f])e[f]=c[f];});e.note=(e.note||"")+" · merged duplicate ("+(r.note||"")+")";continue;}
    byKey.set(key,c);out.push(c);
  }
  return {list:out,merged};
}
let pending=null;
async function importFile(file){
  const name=file.name.toLowerCase();
  try{
    if(name.endsWith(".json")){
      const data=JSON.parse(await file.text());
      if(!data||!Array.isArray(data.customers)) throw new Error("This JSON file isn't a Customer Birthday Reminder backup.");
      pending={kind:"backup",data,list:data.customers,merged:0,source:file.name};
    } else if(/\.(xlsx|xls|csv)$/.test(name)){
      if(!window.XLSX) throw new Error("The spreadsheet reader didn't load. Check your internet connection and try again.");
      const isCsv=name.endsWith(".csv");
      const wb=isCsv?XLSX.read(await file.text(),{type:"string",raw:true}):XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
      const {recs}=recordsFromRows(rows);const {list,merged}=cleanRecords(recs);
      pending={kind:"rows",list,merged,source:file.name};
    } else if(file.type.startsWith("image/")){
      await importPhoto(file); return;
    } else throw new Error("Use an Excel (.xlsx), CSV, backup (.json) or photo (PNG/JPG) file. For a PDF, take a screenshot of each page and import the screenshots.");
    view="customers";render();
  }catch(e){toast(e.message||String(e),6000);}
}
async function shrink(file){
  const img=await createImageBitmap(file);const max=2200,sc=Math.min(1,max/Math.max(img.width,img.height));
  const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  return await new Promise(r=>cv.toBlob(r,"image/jpeg",0.9));
}
async function importPhoto(file){
  let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use("sample"):null;}catch(e){}
  const lim=sample?await sample.limits().catch(()=>null):null;
  if(!sample||!lim||!lim.images){toast("Reading photos needs this app opened in Claude. Otherwise export your list to Excel or CSV and import that.",7000);return;}
  busy="Reading your photo… this can take up to a minute.";render();
  try{
    const blob=await shrink(file);
    const prompt="The image is a photo or screenshot of a customer list (it may be an insurance policy listing). Extract one entry per table row.\n"+
    "Return JSON only: {\"agent_name\": string|null, \"rows\": [{\"row\": number|null, \"name\": string|null, \"company\": string|null, \"birthday\": string|null, \"phone\": string|null, \"email\": string|null, \"manager\": string|null, \"unclear\": string[]}]}.\n"+
    "Rules: use the customer / policy holder name as name and their date of birth as birthday, copied exactly as printed (keep the original date format, e.g. 07/03/1980). "+
    "Copy text exactly; never guess. If a cell is hidden, cut off, blurry or covered, set it to null or copy what is visible, and add the field name (\"name\" or \"birthday\" etc.) to unclear. "+
    "Include rows that are partly hidden. Ignore policy numbers, premiums and payment details. If an agent name appears in the page header, return it as agent_name.";
    const res=await sample.json(prompt,{images:[blob],modelTier:"complex"});
    const rows=(res&&Array.isArray(res.rows))?res.rows:[];
    const recs=rows.map(r=>({name:r.name||"",company:r.company||"",birthdayRaw:r.birthday||"",phone:r.phone||"",email:r.email||"",manager:r.manager||res.agent_name||"",unclear:Array.isArray(r.unclear)?r.unclear:[],note:"Photo row "+(r.row||"?")}));
    const {list,merged}=cleanRecords(recs);
    pending={kind:"rows",list,merged,source:file.name+" (read from photo; please check)"};
    busy=null;view="customers";render();
  }catch(e){busy=null;render();toast(e&&e.code==="not_granted"?"Photo reading was not allowed. You can import an Excel or CSV file instead.":"Couldn't read the photo ("+((e&&(e.code||e.message))||"error")+"). Try a sharper photo or an Excel file.",7000);}
}
function applyPending(mode){
  if(!pending) return;
  if(pending.kind==="backup"){const d=pending.data;S.customers=d.customers.map(c=>Object.assign({id:uid(),verified:true},c));if(mode==="replace"){S.settings=Object.assign({},DEFAULT_SETTINGS,d.settings||{});S.sent=d.sent||{};}S.isExample=false;}
  else if(mode==="replace"){S.customers=pending.list;S.isExample=false;}
  else{ if(S.isExample){S.customers=[];S.isExample=false;}
    const keys=new Set(S.customers.map(c=>normName(c.name)+"|"+c.birthday));let skip=0;
    for(const c of pending.list){const k=normName(c.name)+"|"+c.birthday;if(c.birthday&&keys.has(k)){skip++;continue;}S.customers.push(c);keys.add(k);}
    if(skip) toast(skip+" already in your list were skipped");}
  pending=null;cardCache.clear();save();render();toast("Customer list updated");
}

    const L=pending.list,bad=L.filter(blocked);
    h+=`<div class="panel"><h3>Check before importing</h3><p class="sub" style="margin:0">From <b>${esc(pending.source)}</b>: ${L.length} customers${pending.merged?`, ${pending.merged} duplicate rows merged`:""}. ${bad.length?`<b>${bad.length} need checking</b> and won't get reminders until fixed.`:"All birthdays read correctly."}</p>
    <div class="tablewrap"><table><thead><tr><th>Name</th><th>Birthday</th><th>Phone</th><th>Email</th><th>Status</th></tr></thead><tbody>${L.slice(0,12).map(c=>{const b=bParts(c.birthday);const is=issues(c);return `<tr><td>${esc(c.name)}</td><td>${b?pad(b.d)+"/"+pad(b.m)+(b.y?"/"+b.y:""):"—"}</td><td>${esc(c.phone)||"—"}</td><td>${esc(c.email)||"—"}</td><td>${is.length?is.map(x=>`<span class="issue ${x.block?"block":"soft"}">${esc(x.t)}</span>`).join(""):"OK"}</td></tr>`;}).join("")}</tbody></table></div>
    ${L.length>12?`<p class="meta">…and ${L.length-12} more.</p>`:""}
    <div class="row"><button class="btn primary" data-act="apply" data-mode="replace">Replace my list</button>${pending.kind==="rows"&&!S.isExample?`<button class="btn" data-act="apply" data-mode="add">Add to my list</button>`:""}<button class="btn" data-act="cancelimport">Cancel</button></div></div>`;
  }
  if(editing) return h+editForm(editing);
  const q=search.toLowerCase();
  const list=S.customers.filter(c=>!q||(c.name+" "+c.company+" "+c.phone+" "+c.email).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  h+=`<div class="section"><div class="row" style="justify-content:space-between"><div><h2>Customers<span class=zh>客户</span></h2><p class="sub" style="margin:0">${S.customers.length} clients · ${DB&&dbReady?"synced on all your devices":"saved on this device"}</p></div>
  <div class="row"><button class="btn primary" data-act="import">Import list</button><button class="btn" data-act="add">Add customer</button></div></div>
  <input id="search" type="search" placeholder="Search name, company, phone…" value="${esc(search)}" aria-label="Search customers">
  <div class="list">${list.map(c=>{const b=bParts(c.birthday);const is=issues(c);return `<div class="li"><div class="when">${b?b.d+" "+MON[b.m-1]:"—"}</div><div class="who">${esc(c.name)}<small>${esc([c.company,c.phone,c.email,polSummary(c)].filter(Boolean).join(" · ")||"No contact details")}</small>${is.map(x=>`<span class="issue ${x.block?"block":"soft"}">${esc(x.t)}</span>`).join("")}</div>
   ${confirmDel===c.id?`<span class="row"><span style="font-size:13px">Delete ${esc(c.name)}?</span><button class="btn small danger" data-act="dodelete" data-id="${c.id}">Delete</button><button class="btn small" data-act="canceldel">Keep</button></span>`:`<span class="row"><button class="btn small" data-act="edit" data-id="${c.id}">Edit</button><button class="btn small" data-act="delete" data-id="${c.id}" aria-label="Delete ${esc(c.name)}">Delete</button></span>`}</div>`;}).join("")||`<div class="li">No customers match.</div>`}</div>
  <div class="row"><button class="btn" data-act="backup">Download backup (.json)</button><button class="btn" data-act="csv">Download list (.csv)</button>
  ${confirmClear?`<span class="row"><span>Remove all ${S.customers.length} customers from this device?</span><button class="btn danger" data-act="doclear">Remove all</button><button class="btn" data-act="cancelclear">Keep</button></span>`:`<button class="btn danger" data-act="clear">Remove all</button>`}</div></div>`;
  return h;
}
function vCheck(){
  if(editing) return editForm(editing);
  const hard=S.customers.filter(blocked),soft=S.customers.filter(c=>!blocked(c)&&issues(c).length);
  const row=c=>`<div class="li"><div class="who">${esc(c.name||"(no name)")}<small>${esc(c.note||"")}</small>${issues(c).map(x=>`<span class="issue ${x.block?"block":"soft"}">${esc(x.t)}</span>`).join("")}</div><button class="btn small primary" data-act="edit" data-id="${c.id}">Fix</button></div>`;
  let h=`<div class="section"><div><h2>Needs checking<span class=zh>待检查</span></h2><p class="sub" style="margin:0">The app never guesses a name or birthday. Fix these and they'll get reminders.</p></div>`;
  h+=hard.length?`<p class="label">Won't get reminders until fixed (${hard.length})</p><div class="list">${hard.map(row).join("")}</div>`:`<div class="banner ok"><div class="grow">Every customer has a readable name and birthday.</div></div>`;
  if(soft.length) h+=`<p class="label">Missing contact details (${soft.length}) · still reminded</p><div class="list">${soft.map(row).join("")}</div>`;
  return h+"</div>";
}
function vSettings(){
  const s=S.settings;
  return `<form class="panel" id="setForm"><h2>Settings<span class=zh>设置</span></h2>
  <div class="form">
    <label>Your name (used when a customer has no account manager)<input id="s-sender" value="${esc(s.senderName)}" placeholder="e.g. Ang Siaw Peng"></label>
    <label>Company name (English)<input id="s-coen" value="${esc(s.companyEn)}" placeholder="e.g. your company"></label>
    <label>Company name (中文)<input id="s-cocn" class="cn" value="${esc(s.companyCn)}"></label>
    <label>Country code for local numbers<input id="s-cc" inputmode="numeric" value="${esc(s.countryCode)}" placeholder="60"></label>
    <label>Show birthdays this many days before 提前几天<input id="s-days" type="number" min="0" max="14" value="${esc(s.remindDays)}"></label>
    <label>Birthday format in your files<select id="s-fmt"><option value="DMY" ${s.dateFormat==="DMY"?"selected":""}>Day/Month/Year (14/12/1987)</option><option value="MDY" ${s.dateFormat==="MDY"?"selected":""}>Month/Day/Year (12/14/1987)</option></select></label>
    <label>Default message language<select id="s-lang"><option value="both" ${s.defaultLang==="both"?"selected":""}>English + 中文</option><option value="en" ${s.defaultLang==="en"?"selected":""}>English</option><option value="cn" ${s.defaultLang==="cn"?"selected":""}>中文</option></select></label>
    <label class="full">Test date: pretend today is… (leave empty for the real date)<input id="s-test" type="date" value="${esc(s.testDate)}"></label>
  </div>
  <div class="row"><button class="btn primary" type="submit">Save settings</button></div></form>`;
}
function vGuide(){
  return `<div class="panel guide"><h2>How to use<span class=zh>使用说明</span></h2><ol>
  <li><b>Load your customers.</b> Go to <i>Customers → Import list</i> and pick an Excel or CSV file with columns: Customer Name, Company, Birthday, Phone, Email, Account Manager. A photo or screenshot of a list works too. Check the preview, then tap <i>Replace my list</i>.</li>
  <li><b>Fix anything flagged.</b> The <i>Needs checking</i> tab lists rows with a missing or unreadable birthday or name. They get no reminders until you fix them, so nobody receives a wrong greeting.</li>
  <li><b>Every morning, open Send now.</b> It shows everyone whose birthday is today or in the next ${S.settings.remindDays} days, plus anyone missed in the last week.</li>
  <li><b>Send.</b> Pick English, 中文 or both, edit the message if you like, tap <i>Save card image</i>, then <i>WhatsApp</i>. Check the details, tap <i>Open WhatsApp</i>, attach the card and press Send in WhatsApp. Come back and tap <i>Yes, mark as sent</i>.</li>
  <li><b>Need a list?</b> <i>Download PDF list</i> gives a summary page plus one page per customer with the card, both messages and tap-to-send buttons.</li>
  <li><b>Same list everywhere.</b> Your clients are saved to your Claude account, so phone and computer show the same list. The top right says <i>✓ Synced</i> when everything is saved. A backup download is still a good idea now and then.</li>
  <li><b>Get reminders on your phone.</b> In <i>Upcoming</i>, tap <i>Add reminders to my calendar</i> and open the file. Your phone's calendar then alerts you 7 days before each birthday and at 9am on the day, every year. Do it again after adding new clients: only the new ones are added, nothing is doubled.</li></ol></div>`;
}
async function hydrateCards(){for(const img of document.querySelectorAll("img[data-card]")){const c=S.customers.find(x=>x.id===img.dataset.card);if(c)img.src=await cardDataUrl(c);}}
function findC(id){return S.customers.find(c=>c.id===id);}

document.addEventListener("click",async e=>{
  const v=e.target.closest("[data-view]");if(v){view=v.dataset.view;editing=null;confirmSend=null;render();window.scrollTo(0,0);return;}
  const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act,id=a.dataset.id,c=id&&findC(id),t=today();
  switch(act){
    case "import":$("#fileInput").value="";$("#fileInput").click();break;
    case "lang":S.lang[id]=a.dataset.lang;delete S.drafts[id];save();render();break;
    case "variant":S.variant[id]=(S.variant[id]||0)+1;delete S.drafts[id];save();render();break;
    case "send":confirmSend={id,via:a.dataset.via};opened[id]=false;render();document.getElementById("card-"+id).scrollIntoView({block:"nearest"});break;
    case "cancelsend":confirmSend=null;render();break;
    case "opened":opened[id]=true;setTimeout(render,300);break;
    case "marksent":S.sent[id+"|"+a.dataset.year]=ymdStr(today());confirmSend=null;save();render();toast("Marked as sent");break;
    case "unsent":delete S.sent[id+"|"+a.dataset.year];save();render();break;
    case "copy":{const txt=document.getElementById("msg-"+id).value;try{await navigator.clipboard.writeText(txt);toast("Message copied");}catch(err){const ta=document.getElementById("msg-"+id);ta.focus();ta.select();toast("Selected: press Copy");}break;}
    case "savecard":{const cv=(await ensureFonts(),drawCard(c));cv.toBlob(b=>saveFile("birthday-card-"+c.name.replace(/[^\w]+/g,"-").toLowerCase()+".png",b),"image/png");break;}
    case "pdf":{const {due,missed}=sendList(t);const items=[...due.filter(d=>!d.sent),...missed];if(!items.length){toast("Everyone on the list is already marked as sent");break;}
      a.disabled=true;a.textContent="Making PDF…";try{const blob=await buildPdf(items,t);await saveFile("birthday-list-"+ymdStr(t)+".pdf",blob);}catch(err){toast("Couldn't make the PDF: "+(err.message||err),6000);}a.disabled=false;a.textContent="Download PDF list";break;}
    case "ics":{const r=buildIcs();if(!r.nb){toast("No clients with a birthday yet");break;}await saveFile("client-birthdays.ics",new Blob([r.text],{type:"text/calendar"}));toast(r.nb+" birthdays"+(r.np?" and "+r.np+" premium dates":"")+" ready: open the file to add them to your calendar",6000);break;}
    case "apply":applyPending(a.dataset.mode);break;
    case "cancelimport":pending=null;render();break;
    case "add":editing={id:uid(),name:"",company:"",birthday:"",phone:"",email:"",manager:S.settings.senderName,verified:true,_new:true};render();break;
    case "edit":e.preventDefault();editing=Object.assign({},c);if(view!=="check")view="customers";render();window.scrollTo(0,0);break;
    case "canceledit":editing=null;render();break;
    case "delete":confirmDel=id;render();break;
    case "canceldel":confirmDel=null;render();break;
    case "dodelete":S.customers=S.customers.filter(x=>x.id!==id);confirmDel=null;save();render();toast("Customer deleted");break;
    case "clear":confirmClear=true;render();break;
    case "cancelclear":confirmClear=false;render();break;
    case "doclear":S.customers=[];S.isExample=false;confirmClear=false;save();render();toast("All customers removed");break;
    case "backup":{const data={app:"customer-birthday-reminder",version:1,settings:S.settings,customers:S.customers,sent:S.sent};await saveFile("birthday-reminder-backup-"+ymdStr(new Date())+".json",new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));break;}
    case "csv":{const head=["Customer Name","Company","Birthday","Phone","Email","Account Manager","Note"];const q=v=>'"'+String(v||"").replace(/"/g,'""')+'"';
      const rows=S.customers.map(c=>{const b=bParts(c.birthday);return [c.name,c.company,b?pad(b.d)+"/"+pad(b.m)+(b.y?"/"+b.y:""):"",c.phone,c.email,c.manager,c.note].map(q).join(",");});
      await saveFile("customers.csv",new Blob(["﻿"+head.join(",")+"\n"+rows.join("\n")],{type:"text/csv"}));break;}
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="search"){search=e.target.value;const pos=e.target.selectionStart;render();const s=$("#search");s.focus();s.setSelectionRange(pos,pos);}
  if(e.target.dataset.msg){const id=e.target.dataset.msg,c=findC(id);S.drafts[id]={key:e.target.dataset.year+"|"+langOf(c),v:S.variant[id]||0,text:e.target.value};save();}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="editForm"){
    const name=titleCase($("#f-name").value);const full=$("#f-bday").value,dm=$("#f-bdm").value.trim();
    let birthday="";
    if(full){const [y,m,d]=full.split("-").map(Number);birthday=toBStr(y,m,d);}
    else if(dm){const mm=/^(\d{1,2})[\/\-.](\d{1,2})$/.exec(dm);if(mm){const d=S.settings.dateFormat==="MDY"?+mm[2]:+mm[1],m=S.settings.dateFormat==="MDY"?+mm[1]:+mm[2];if(validMD(null,m,d))birthday=toBStr(null,m,d);}
      if(!birthday){toast("Write the day and month like 14/12",4000);return;}}
    if(!name){toast("Please enter the customer's name");return;}
    const rec=Object.assign({},editing,{name,birthday,phone:$("#f-phone").value.trim(),email:$("#f-email").value.trim().toLowerCase(),company:$("#f-company").value.trim(),manager:titleCase($("#f-manager").value),verified:true});
    const isNew=rec._new;delete rec._new;
    if(!birthday) rec.note=rec.note||"Birthday not entered";
    else if(rec.verified) rec.note=(rec.note||"").replace(/ ?- please.*$/i,"");
    if(isNew){if(S.isExample){S.customers=[];S.isExample=false;}S.customers.push(rec);}else S.customers=S.customers.map(c=>c.id===rec.id?rec:c);
    editing=null;cardCache.clear();save();render();toast(isNew?"Customer added":"Saved");
  }
  if(e.target.id==="setForm"){
    const days=Math.max(0,Math.min(14,parseInt($("#s-days").value,10)||0));
    S.settings=Object.assign(S.settings,{senderName:$("#s-sender").value.trim(),companyEn:$("#s-coen").value.trim(),companyCn:$("#s-cocn").value.trim(),countryCode:$("#s-cc").value.replace(/\D/g,""),remindDays:days,dateFormat:$("#s-fmt").value,defaultLang:$("#s-lang").value,testDate:$("#s-test").value});
    S.drafts={};cardCache.clear();save();render();toast("Settings saved");
  }
});
$("#fileInput").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)importFile(f);});

S=loadState();
render();
initDb();
ensureFonts().then(()=>{cardCache.clear();hydrateCards();});
/* hooks for automated testing */
window.CBR={get state(){return S;},setState(s){S=Object.assign({drafts:{},variant:{},lang:{},sent:{}},s);S.settings=Object.assign({},DEFAULT_SETTINGS,s.settings||{});render();},sendList:()=>sendList(today()),buildPdf:()=>{const t=today(),{due,missed}=sendList(t);return buildPdf([...due.filter(d=>!d.sent),...missed],t);},today,render,setView(v){view=v;render();},parseDateAny,cleanRecords,recordsFromRows,phoneInfo,messages,nextInfo,issues};
})();
</script>

</body></html>
